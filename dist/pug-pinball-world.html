      try { localStorage.setItem(KEY, JSON.stringify(this.data)); this.ok = true; return true; }
      catch (e) { const first = this.ok; this.ok = false; this.err = e; if (first && this.onError) this.onError(e); return false; }
    },
    reset() { this.data = fresh(); try { localStorage.removeItem(KEY); } catch (e) { } this.ensureDaily(); this.commit(); },
    today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
    xpNeed(l) { return Math.round(120 * Math.pow(l, 1.4)); },
    // 日付から決まる3つの課題（毎日更新）
    ensureDaily() {
      const S = this.data, day = this.today(); if (S.daily && S.daily.date === day) return;
      let h = 0; for (const ch of day) h = (h * 31 + ch.charCodeAt(0)) >>> 0; const rnd = () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; };
      const un = S.unlocked.filter(i => i <= 10), st = un[Math.floor(rnd() * un.length)], sc = [20000, 50000, 100000][Math.floor(rnd() * 3)];
      const pool = [{ t: 'score', n: sc, label: '1ゲームで' + sc.toLocaleString() + '点とる' }, { t: 'bumper', n: 80, label: 'バンパーに80回当てる' }, { t: 'paw', n: 20, label: '肉球バンパーに20回当てる（ステージ1など）' },
      { t: 'combo5', n: 5, label: '5コンボを5回決める' }, { t: 'clear', n: 1, stage: st, label: 'ステージ' + st + 'をクリアする' }, { t: 'play', n: 3, label: '3回プレイする' }, { t: 'best', n: 1, label: '今日のハイスコアを更新する' }];
      const tasks = []; while (tasks.length < 3) { const i = Math.floor(rnd() * pool.length); tasks.push(Object.assign({ p: 0, done: false }, pool.splice(i, 1)[0])); }

    },
    markClear(id) { const S = this.data, first = !S.cleared[id]; S.cleared[id] = (S.cleared[id] || 0) + 1; if (id < 10 && !S.unlocked.includes(id + 1)) S.unlocked.push(id + 1); this.commit(); return first; },
    markSecret(id) {
      const S = this.data, out = []; S.secrets[id] = 1;

    },
    checkAch() {
      const S = this.data, out = [];
      for (let pass = 0; pass < 2; pass++) for (const a of PP.ACH) if (!S.ach[a.id] && a.ok(S)) { S.ach[a.id] = this.today(); S.bow += a.bow; let item = null; if (a.pug && !S.pugs.includes(a.pug)) { S.pugs.push(a.pug); item = PP.PUGS.find(p => p.id === a.pug).name; } out.push({ a, item }); }
      return out;
    },
    // 1ゲーム終了時の集計
    applyResult(g, firstClear) {
      this.ensureDaily(); const S = this.data, id = g.st.id, c = g.cnt, r = { score: g.score, combo: g.maxCombo, items: [], levelUps: [], daily: [] };
      S.plays++; S.daily.plays++; S.lastStage = id;
      r.best = g.score > (S.best[id] || 0); r.prevBest = S.best[id] || 0; if (r.best) S.best[id] = g.score;
      const top = S.top[id] = (S.top[id] || []); top.push({ s: g.score, d: this.today() }); top.sort((a, b) => b.s - a.s); top.length = Math.min(top.length, 5);
      S.history.unshift({ id, s: g.score, c: g.maxCombo, d: this.today(), cl: g.cleared ? 1 : 0 }); S.history.length = Math.min(S.history.length, 30);
      const st = S.stats; st.bestScore = Math.max(st.bestScore, g.score); st.bestCombo = Math.max(st.bestCombo, g.maxCombo); st.bumpers += c.bumper || 0; st.totalScore += g.score;
      for (const k of ['fever', 'multiball', 'jackpot', 'superjp', 'boss']) st[k] += c[k] || 0;
      r.cleared = g.cleared; r.firstClear = firstClear;
      r.bow = Math.round((Math.floor(g.score / 500) + g.bow + (g.cleared ? (firstClear ? 100 + 50 * Math.min(id, 10) : 30) : 0)) * (g.st.bowMul || 1));
      r.xp = Math.floor(g.score / 200) + 20 + (g.cleared ? 100 : 0);
      S.bow += r.bow; S.xp += r.xp;
      while (S.xp >= this.xpNeed(S.level)) { S.xp -= this.xpNeed(S.level); S.level++; const rw = 50 + 25 * S.level; S.bow += rw; r.levelUps.push({ level: S.level, bow: rw }); }
      const todayBest = g.score > S.daily.best && S.daily.best > 0 || (S.daily.best === 0 && r.best && r.prevBest > 0); S.daily.best = Math.max(S.daily.best, g.score);
      for (const t of S.daily.tasks) {
        if (t.done) continue;
        if (t.t === 'score') t.p = Math.max(t.p, Math.min(t.n, g.score)); else if (t.t === 'play') t.p++; else if (t.t === 'clear') { if (g.cleared && id === t.stage) t.p = 1; } else if (t.t === 'best') { if (todayBest || r.best) t.p = 1; } else t.p = Math.min(t.n, t.p + (c[t.t] || 0));
        if (t.p >= t.n) { t.done = true; S.bow += 80; r.daily.push({ label: t.label, bow: 80 }); }
      }
      if (!S.daily.bonus && S.daily.tasks.every(t => t.done)) { S.daily.bonus = true; S.bow += 100; r.daily.push({ label: '今日の課題を全部達成！', bow: 100 }); }
      r.ach = this.checkAch(); for (const x of r.ach) if (x.item) r.items.push(x.item);
      r.level = S.level; r.xpNow = S.xp; r.xpNeed = this.xpNeed(S.level); r.saved = this.commit(); return r;
    }
  };
})();

<script>
/* PUG PINBALL WORLD - サウンド（WebAudioでその場で合成するオリジナル音。音声ファイル不要） */
(function () {
  'use strict';
  const PP = window.PP;
  const A = PP.Audio = {
    ctx: null, bgmV: 0.5, sfxV: 0.8, last: {}, cfg: null, timer: null, step: 0, nextT: 0, feverOn: false, pat: null,
    unlock() {
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC();
          this.gS = this.ctx.createGain(); this.gB = this.ctx.createGain(); this.gS.connect(this.ctx.destination); this.gB.connect(this.ctx.destination); this.setVol(this.bgmV, this.sfxV);
          const n = this.ctx.sampleRate * 0.5; this.noiseBuf = this.ctx.createBuffer(1, n, this.ctx.sampleRate); const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      } catch (e) { this.ctx = null; }
    },
    setVol(b, s) { this.bgmV = b; this.sfxV = s; if (this.ctx) { this.gB.gain.value = b * 0.22; this.gS.gain.value = s * 0.5; } },
    suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); }, resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
    tone(f, dur, type, vol, f2, when, out) {
      const c = this.ctx; if (!c) return; const t = (when || c.currentTime), o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.3, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(out || this.gS); o.start(t); o.stop(t + dur + 0.03);
    },
    noise(dur, vol, freq, when, out) {
      const c = this.ctx; if (!c) return; const t = when || c.currentTime, s = c.createBufferSource(), g = c.createGain(), fl = c.createBiquadFilter();
      s.buffer = this.noiseBuf; fl.type = 'bandpass'; fl.frequency.value = freq || 2000; g.gain.setValueAtTime(vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(fl); fl.connect(g); g.connect(out || this.gS); s.start(t); s.stop(t + dur + 0.02);
    },
    bark(when, pitch) { const c = this.ctx; if (!c) return; const t = when || c.currentTime, p = pitch || 1; this.tone(430 * p, 0.1, 'sawtooth', 0.32, 250 * p, t); this.tone(860 * p, 0.07, 'square', 0.1, 500 * p, t); this.noise(0.06, 0.15, 1200, t); },
    arp(notes, step, type, vol) { const c = this.ctx; if (!c) return; notes.forEach((n, i) => this.tone(n, step * 1.8, type || 'triangle', vol || 0.28, 0, c.currentTime + i * step)); },
    sfx(name, p) {
      const c = this.ctx; if (!c || this.sfxV <= 0) return; const now = c.currentTime; if (this.last[name] && now - this.last[name] < 0.04) return; this.last[name] = now;
      switch (name) {
        case 'launch': this.tone(180, 0.3, 'sawtooth', 0.22, 950); this.noise(0.2, 0.15, 900); break;
        case 'flip': this.tone(170, 0.08, 'sine', 0.35, 340); this.noise(0.03, 0.12, 2500); break;
        case 'bumper': { const sc = [523, 587, 659, 784, 880, 1047], f = sc[Math.floor(Math.random() * sc.length)] * (p && p > 700 ? 1.2 : 1); this.tone(f, 0.11, 'triangle', 0.3, f * 0.72); this.tone(f * 2, 0.05, 'sine', 0.12); break; }
        case 'target': this.tone(740, 0.06, 'square', 0.16); this.tone(1110, 0.09, 'square', 0.16, 0, now + 0.06); break;
        case 'gate': this.tone(988, 0.12, 'sine', 0.26); this.tone(1319, 0.14, 'sine', 0.2, 0, now + 0.07); break;
        case 'combo': { const n = Math.min(p || 2, 14); this.tone(440 * Math.pow(2, n / 12), 0.09, 'square', 0.13); break; }
        case 'sling': this.tone(300, 0.07, 'square', 0.14, 520); break;
        case 'wall': this.noise(0.03, Math.min(0.2, (p || 300) / 5000), 1500 + Math.min(2500, p || 0)); break;
        case 'hole': this.tone(330, 0.25, 'sine', 0.3, 110); break;
        case 'eject': this.tone(160, 0.14, 'sine', 0.3, 520); break;
        case 'rail': this.tone(400, 0.5, 'sawtooth', 0.12, 1200); break;
        case 'food': this.tone(1320, 0.06, 'sine', 0.22); this.tone(1760, 0.09, 'sine', 0.2, 0, now + 0.05); break;
        case 'spin': this.tone(660, 0.05, 'triangle', 0.16, 990); break;
        case 'bark': this.bark(); break;
        case 'bark2': this.bark(now, 1.1); this.bark(now + 0.16, 1.25); break;
        case 'fever': this.arp([523, 659, 784, 1047, 1319, 1568], 0.07, 'square', 0.2); this.bark(now + 0.45, 1.2); this.bark(now + 0.6, 1.35); break;
        case 'jackpot': this.arp([784, 988, 1175, 1568, 1976], 0.06, 'triangle', 0.3); this.bark(now + 0.35, 1.3); break;
        case 'clear': this.arp([523, 523, 659, 784, 1047, 784, 1047], 0.12, 'triangle', 0.32); break;
        case 'levelup': this.arp([659, 784, 988, 1319], 0.09, 'square', 0.2); break;
        case 'extra': this.arp([880, 1109, 1319, 1760], 0.08, 'sine', 0.3); break;
        case 'drain': this.tone(420, 0.55, 'triangle', 0.3, 110); this.tone(300, 0.3, 'sine', 0.2, 150, now + 0.25); break;
        case 'saved': this.tone(520, 0.1, 'sine', 0.25, 780); break;
        case 'over': this.arp([392, 349, 311, 262], 0.2, 'triangle', 0.3); break;
        case 'ui': this.tone(700, 0.05, 'sine', 0.2); break;
        case 'buy': this.arp([988, 1319, 1976], 0.06, 'sine', 0.26); break;
        case 'ng': this.tone(200, 0.15, 'square', 0.15, 150); break;
        case 'boss': this.tone(140, 0.15, 'sawtooth', 0.3, 80); this.bark(now + 0.05, 0.7); break;
      }
    },
    // ----- BGM：ステージごとの音階とテンポから自動でメロディを作る -----
    bgm(cfg) {
      if (this.timer) { clearInterval(this.timer); this.timer = null; } this.cfg = cfg; if (!cfg || !this.ctx) return;
      let h = cfg.root * 7919 + cfg.bpm; const rnd = () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; };
      const pat = []; let deg = 2; for (let i = 0; i < 64; i++) { if (i % 16 === 0) deg = [2, 4, 3, 2][(i / 16) | 0]; const r = rnd(); if (i % 2 === 1 && r < 0.45) { pat.push(null); continue; } deg += r < 0.35 ? -1 : r < 0.7 ? 1 : r < 0.85 ? 2 : -2; deg = Math.max(0, Math.min(cfg.scale.length * 2 - 1, deg)); pat.push(deg); }
      this.pat = pat; this.step = 0; this.nextT = this.ctx.currentTime + 0.1; this.timer = setInterval(() => this.tick(), 70);
    },
    tick() {
      const c = this.ctx, cfg = this.cfg; if (!c || !cfg || c.state !== 'running' || this.bgmV <= 0) { if (c) this.nextT = c.currentTime + 0.1; return; }

        const i = this.step % 64, t = this.nextT, d = this.pat[i];
        if (d != null) { const m = cfg.root + 12 + sc[d % sc.length] + 12 * Math.floor(d / sc.length) + (this.feverOn ? 12 : 0), sn = cfg.wave === 'sanshin'; this.tone(hz(m), sn ? 0.22 : spb * 1.6, sn ? 'sawtooth' : cfg.wave, sn ? 0.5 : cfg.wave === 'sine' || cfg.wave === 'triangle' ? 0.6 : 0.3, sn ? hz(m) * 0.985 : 0, t, this.gB); }
        if (i % 4 === 0) { const bd = [0, 0, 3, 4, 0, 0, 2, 4][(i / 8) | 0] % sc.length; this.tone(hz(cfg.root - 12 + sc[bd]), spb * 3, 'triangle', 0.8, 0, t, this.gB); }
        if (i % 2 === 1) this.noise(0.03, this.feverOn ? 0.25 : 0.12, 6000, t, this.gB);
        this.nextT += spb; this.step++;
      }
    },
    fever(on) { this.feverOn = on; }
  };
})();

      <div class="card daily"><h3>今日のチャレンジ</h3>${s.daily.tasks.map(t => `<div class="task ${t.done ? 'done' : ''}"><span>${t.done ? '✓' : '・'} ${esc(t.label)}</span><b>${t.done ? '達成 +80' : (t.t === 'score' ? fmt(t.p) : t.p) + '/' + (t.t === 'score' ? fmt(t.n) : t.n)}</b></div>`).join('')}<p class="note">1つ達成で80バウ、全部で+100バウ。毎日0時に入れかわります</p></div>

    mascot() {
      const cv = $('#mascot'); if (!cv) return; const c = cv.getContext('2d'), s = S(), p = PP.PUGS.find(x => x.id === s.pug) || PP.PUGS[0], bl = PP.BALLS.find(x => x.id === s.ball) || PP.BALLS[0], fc = PP.CUSTOM.flipper.items.find(x => x.id === s.look.flipper) || PP.CUSTOM.flipper.items[0];
      let last = 0; const loop = (ts) => {
        if (this.cur !== 'title' || !document.body.contains(cv)) return; this.mascotRaf = requestAnimationFrame(loop); if (ts - last < 33) return; last = ts; const t = ts / 1000;
        c.setTransform(2, 0, 0, 2, 0, 0); c.clearRect(0, 0, 260, 170);
        const wag = Math.sin(t * 7) * 0.5; for (const sd of [0, 1]) { const f = { px: sd ? 196 : 64, py: 138, a: sd ? Math.PI + 0.3 + wag : -0.3 - wag }; PP.drawTail(c, f, fc, {}, t); }
        const bx = 130 + Math.sin(t * 1.7) * 92, by = 40 + Math.abs(Math.sin(t * 3.4)) * 70; c.save(); c.translate(bx, 150 - by); c.drawImage(PP.ballSprite(bl), -15, -15, 30, 30); c.restore();
        c.save(); c.translate(130, 96); const an = p.anim; if (an === 'bounce') c.translate(0, -Math.abs(Math.sin(t * 3)) * 10); else if (an === 'tilt') c.rotate(Math.sin(t * 2) * 0.22); else if (an === 'nod') c.translate(0, Math.sin(t * 4) * 4); else if (an === 'wiggle') c.translate(Math.sin(t * 6) * 5, 0); else if (an === 'float') { c.translate(0, Math.sin(t * 1.5) * 8); c.rotate(Math.sin(t * 1.1) * 0.1); }
        PP.pugFace(c, 50, { fur: p.fur, acc: p.acc, expr: (t % 4) > 3.8 ? 'sleepy' : (t % 9) > 7 ? 'happy' : 'normal' }); c.restore();
      }; this.mascotRaf = requestAnimationFrame(loop);
    },

    // ===== ステージ選択 =====
    r_stages() {

    // ===== コレクション =====
    r_collection() {
      const s = S(), el = $('#s-collection'), tab = this.tab || 'pug';
      el.innerHTML = this.head('コレクション') + `<div class="tabs">${[['pug', 'パグ'], ['ball', 'ボール'], ['custom', 'カスタム']].map(t => `<button class="${tab === t[0] ? 'on' : ''}" data-act="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div><div id="col"></div>`;

      if (tab === 'pug') {

        for (const p of PP.PUGS) { const ow = s.pugs.includes(p.id); const hid = !ow && p.price < 0, cv = pugCv(hid ? 'black' : p.fur, hid ? 'sleepy' : 'normal', hid ? null : p.acc, 64); if (hid) cv.style.filter = 'brightness(.3)'; else if (!ow) cv.style.opacity = '.8'; g.appendChild(card('pug', p, ow, s.pug === p.id, cv, ow ? p.say : p.how)); } col.appendChild(g);

    pick(cat, id) {
      const s = S(), list = cat === 'pug' ? PP.PUGS : cat === 'ball' ? PP.BALLS : PP.CUSTOM[cat].items, it = list.find(x => x.id === id), own = cat === 'pug' ? s.pugs : cat === 'ball' ? s.balls : s.owned[cat];
      const set = () => { if (cat === 'pug') s.pug = id; else if (cat === 'ball') s.ball = id; else s.look[cat] = id; PP.Save.commit(); this.r_collection(); };
      if (own.includes(id)) { PP.Audio.sfx('ui'); set(); return; }
      if (it.price < 0) { PP.Audio.sfx('ng'); this.toast(it.how || 'ひみつの条件で手に入ります'); return; }

      PP.Audio.sfx('ui'); this.confirm(`「${esc(it.name)}」を <b>${fmt(it.price)} バウ</b>で手に入れますか？`, '手に入れる', () => { s.bow -= it.price; own.push(id); PP.Audio.sfx('buy'); const got = PP.Save.checkAch(); set(); this.toast(got.length ? '実績達成：' + got.map(x => x.a.name).join('、') : '手に入れました！'); });
    },

    // ===== 実績 =====
    r_ach() {
      const s = S(), el = $('#s-ach'), n = PP.ACH.filter(a => s.ach[a.id]).length;
      el.innerHTML = this.head('実績') + `<div class="card"><div class="rate"><b>${Math.round(n / PP.ACH.length * 100)}%</b><span class="xp"><i style="width:${n / PP.ACH.length * 100}%"></i></span><small>${n} / ${PP.ACH.length} 達成</small></div></div><div class="list">${PP.ACH.map(a => `<div class="ach ${s.ach[a.id] ? 'done' : ''}"><span class="mk">${s.ach[a.id] ? '★' : '☆'}</span><div><b>${esc(a.name)}</b><small>${esc(a.desc)}</small></div><em>${a.pug ? '王様パグ' : ''} +${a.bow}バウ</em></div>`).join('')}</div>`;
    },

    // ===== きろく（ローカルランキング） =====
    r_records() {
      const s = S(), el = $('#s-records'), total = Object.keys(s.best).reduce((a, k) => a + s.best[k], 0);
      el.innerHTML = this.head('きろく') + `<div class="card"><h3>総合スコア（各ステージのベスト合計）</h3><p class="bigNum">${fmt(total)}</p><p class="note">プレイ ${s.plays}回 ／ 最高コンボ ${s.stats.bestCombo} ／ 累計 ${fmt(s.stats.totalScore)}点<br>※この端末だけのローカル記録です。オンラインランキングは未実装です</p></div>
      <h3 class="sec">ステージ別ベスト5</h3><div class="list">${PP.STAGES.filter(st => s.unlocked.includes(st.id)).map(st => `<div class="rec"><b>${String(st.id).padStart(2, '0')} ${esc(st.name)}</b><ol>${(s.top[st.id] || []).map(r => `<li>${fmt(r.s)} <small>${r.d}</small></li>`).join('') || '<li class="none">まだ記録がありません</li>'}</ol></div>`).join('')}</div>
      <h3 class="sec">さいきんのプレイ</h3><div class="list">${s.history.slice(0, 15).map(r => { const st = PP.STAGES.find(x => x.id === r.id); return `<div class="hist"><span>${r.d.slice(5)} ${esc(st ? st.name : '')}${r.cl ? ' ★' : ''}</span><b>${fmt(r.s)}</b><small>${r.c}コンボ</small></div>`; }).join('') || '<p class="note c">まだプレイ記録がありません</p>'}</div>`;
    },

    // ===== 設定 =====
    r_settings() {
      const s = S(), st = s.settings, el = $('#s-settings');
      el.innerHTML = this.head('設定') + `<div class="card set">
      <label>BGM音量<input type="range" min="0" max="100" value="${Math.round(st.bgm * 100)}" data-k="bgm"></label>
      <label>効果音音量<input type="range" min="0" max="100" value="${Math.round(st.sfx * 100)}" data-k="sfx"></label>
      <div class="rowb"><span>振動${navigator.vibrate ? '' : '<small>（この端末・ブラウザは非対応）</small>'}</span><button class="tog ${st.vib ? 'on' : ''}" data-act="vib">${st.vib ? 'ON' : 'OFF'}</button></div>
      <div class="rowb"><span>画質</span><span class="seg"><button class="${st.quality === 'high' ? 'on' : ''}" data-act="quality" data-v="high">きれい</button><button class="${st.quality === 'low' ? 'on' : ''}" data-act="quality" data-v="low">かるい</button></span></div></div>
      <div class="card"><button class="btn sub w" data-act="tutorial">操作説明（チュートリアルをもう一度）</button><button class="btn sub w" data-act="help">イベントと発生条件を見る</button>
      <p class="note">操作：画面の左側タップ＝左のしっぽ、右側タップ＝右のしっぽ。<br>PCは ← → キー（または Z / M）、発射はスペース長押し、P で一時停止</p></div>
      <div class="card"><button class="btn danger w" data-act="reset">データリセット</button><p class="note">保存：${PP.Save.ok ? 'この端末のブラウザ内に自動保存中' : '保存できない環境です'}（データ形式 v${s.v}）</p></div>`;
      el.querySelectorAll('input[type=range]').forEach(inp => inp.oninput = () => { st[inp.dataset.k] = inp.value / 100; PP.App.applySettings(); if (inp.dataset.k === 'sfx') PP.Audio.sfx('bumper'); }, false);

    // ===== 一時停止 =====
    r_pause() {

      el.innerHTML = `<div class="mbox wide"><h2>ポーズ</h2><p class="note c">STAGE ${String(g.st.id).padStart(2, '0')} ${esc(g.st.name)}</p><div class="miss">${g.missions.map(m => `<div class="${m.done ? 'done' : ''}"><span>${m.done ? '✓' : '○'} ${esc(m.t)}</span><b>${m.k === 'score' ? fmt(m.p) + ' / ' + fmt(m.n) : m.p + ' / ' + m.n}</b></div>`).join('')}</div>
      <button class="btn big" data-act="resume">つづける</button><div class="row"><button class="btn sub" data-act="retry">やりなおす</button><button class="btn sub" data-act="quit">やめる</button></div><details><summary>イベントと発生条件</summary>${this.helpHtml()}</details></div>`;
    },

    // ===== リザルト =====
    showResult(r) {
      this.result = r; this.show('result'); const el = $('#s-result'), id = PP.App.stageId, canNext = r.cleared && id < 10 && S().unlocked.includes(id + 1);
      el.innerHTML = `<div class="mbox wide res"><h2>${r.cleared ? 'ステージクリア！' : 'ゲームオーバー'}</h2><div class="rpug"></div>
      <p class="bigNum">${fmt(r.score)}<small>点</small></p>${r.best ? '<p class="newbest">★ 自己ベスト更新！ ★</p>' : `<p class="note c">自己ベスト ${fmt(r.prevBest)}</p>`}
      <div class="stats"><div><small>最高コンボ</small><b>${r.combo}</b></div><div><small>獲得XP</small><b>+${fmt(r.xp)}</b></div><div><small>獲得バウ</small><b>+${fmt(r.bow)}</b></div></div>

      ${r.saved ? '' : '<p class="warn">保存に失敗しました。ブラウザの空き容量やプライベートモードを確認してください</p>'}
      <button class="btn big" data-act="again">もう一度遊ぶ</button><div class="row">${canNext ? '<button class="btn sub" data-act="next">つぎのステージ</button>' : ''}<button class="btn sub" data-act="go" data-v="stages">ステージ選択</button><button class="btn sub" data-act="go" data-v="title">タイトル</button></div></div>`;
      const p = PP.PUGS.find(x => x.id === S().pug) || PP.PUGS[0]; $('.rpug', el).appendChild(pugCv(p.fur, r.cleared || r.best ? 'happy' : 'sad', p.acc, 84));
    }
  };
})();

</script>
<script>
/* PUG PINBALL WORLD - 起動・入力・ゲームループ・演出のつなぎ込み */
(function () {
  'use strict';
  const PP = window.PP, Save = PP.Save, Au = PP.Audio, UI = PP.UI;
  const cv = document.getElementById('game'), rend = new PP.Renderer(cv);
  const ptr = new Map(), keys = { L: false, R: false };
  let raf = 0, last = 0, chargeAt = 0, overTimer = 0, tutTimer = 0;
  const vib = (p) => { if (Save.data.settings.vib && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) { } } };
  const BCOL = { paw: '#ff9ec4', face: '#ffe066', shisa: '#ff8a4c', planet: '#c9a2ff', fish: '#ffb347', candy: '#ff5c8a', snow: '#ffffff', manju: '#d9a066', eel: '#fff', boss: '#ffd24a', gold: '#ffd84a' };

  const App = PP.App = {
    g: null, stageId: 1, paused: false, running: false, firstClear: false, gotItems: [],
    look() {
      const s = Save.data, f = (l, id) => l.find(x => x.id === id) || l[0], fr = f(PP.CUSTOM.frame.items, s.look.frame);
      return { pug: f(PP.PUGS, s.pug), ball: f(PP.BALLS, s.ball), flip: f(PP.CUSTOM.flipper.items, s.look.flipper), effect: s.look.effect, bumper: s.look.bumper, frameC: fr.c || null, bg: s.look.bg };
    },
    applySettings() { const st = Save.data.settings; Au.setVol(st.bgm, st.sfx); if (rend.quality !== st.quality) { rend.quality = st.quality; rend.resize(); } },
    start(id) {
      const st = PP.STAGES.find(s => s.id === id) || PP.STAGES[0]; clearTimeout(overTimer); clearTimeout(tutTimer);
      this.stageId = st.id; this.firstClear = false; this.gotItems = []; this.paused = false; ptr.clear(); keys.L = keys.R = false; chargeAt = 0;
      const g = this.g = new PP.Game(st, onEvent); rend.setGame(g, this.look()); Save.data.lastStage = st.id;
      if (!Save.data.tutorialDone && st.id === 1) { g.locked = true; rend.tut = { step: 0 }; }
      UI.show(null); Au.unlock(); Au.fever(false); Au.bgm(st.bgm); rend.banner('STAGE ' + String(st.id).padStart(2, '0') + '　' + st.name, g.missions[0] ? '目標：' + g.missions.map(m => m.t).join(' ／ ') : '');
      this.run();
    },
    run() { if (this.running) return; this.running = true; last = performance.now(); raf = requestAnimationFrame(frame); },
    stop() { this.running = false; cancelAnimationFrame(raf); },
    pause() { if (!this.g || this.g.over || this.paused || UI.cur) return; this.paused = true; this.g.setFlip(0, false); this.g.setFlip(1, false); ptr.clear(); chargeAt = 0; rend.charge = -1; this.stop(); Au.suspend(); UI.show('pause'); },
    resume() { if (!this.paused) return; this.paused = false; UI.show(null); Au.resume(); this.run(); },
    finish(show) { const g = this.g; if (!g || g.done) return null; g.done = true; clearTimeout(overTimer); this.stop(); Au.bgm(null); Au.resume(); const r = Save.applyResult(g, this.firstClear); if (r.levelUps.length) Au.sfx('levelup'); if (show) UI.showResult(r); return r; },
    retry() { this.paused = false; this.finish(false); this.start(this.stageId); },
    quit() { this.paused = false; this.finish(true); }
  };

  // ----- ゲームからの通知 → 音・演出・振動・保存 -----
  function onEvent(n, d) {
    const g = App.g; if (!g) return;
    switch (n) {
      case 'score': if (d.pts >= 50) rend.pop(d.x, d.y, '+' + d.pts.toLocaleString(), d.big); if (d.big) { rend.mood = 'happy'; rend.moodT = 1; } break;
      case 'bumper': Au.sfx(d.k === 'boss' ? 'boss' : 'bumper', d.v); if (d.k === 'face' || d.k === 'shisa') Au.sfx('bark'); rend.burst(d.x, d.y, 5, BCOL[d.k] || '#ffe066'); vib(8); break;
      case 'target': Au.sfx('target'); rend.burst(d.x, d.y, 7, '#fff'); vib(12); break;
      case 'bank': Au.sfx('bark2'); vib([20, 30, 20]); break;
      case 'gate': Au.sfx('gate'); rend.burst(d.x, d.y, 4, '#ffe14a'); break;
      case 'hole': Au.sfx('hole'); vib(20); break;
      case 'eject': Au.sfx('eject'); rend.burst(d.x, d.y, 6, '#fff'); break;
      case 'railIn': Au.sfx('rail'); break;
      case 'railEnd': rend.burst(d.pts[d.pts.length - 1][0], d.pts[d.pts.length - 1][1], 10, '#ffe14a'); vib(15); break;
      case 'flip': Au.sfx('flip'); rend.flip(d); { const f = g.flips[d]; rend.burst(f.px + (d ? -50 : 50), f.py - 6, 2, d ? '#9fd0ff' : '#ff9ec4', 60); } tutorial('flip', d); break;
      case 'flipHit': vib(6); break;
      case 'launch': Au.sfx('launch'); vib(15); tutorial('launch'); break;
      case 'sling': Au.sfx('sling'); vib(8); break;
      case 'wall': Au.sfx('wall', d); break;
      case 'ballHit': Au.sfx('wall', d * 2); break;
      case 'combo': Au.sfx('combo', d); if (d === 5 || d === 10 || d % 25 === 0) vib(25); break;
      case 'food': Au.sfx('food'); rend.burst(d.x, d.y, 4, '#d9a066'); break;
      case 'spin': Au.sfx('spin'); break;
      case 'burst': rend.burst(d.x, d.y, 16, '#fff', 200); break;
      case 'bossHit': rend.shake = 0.12; break;
      case 'bossDown': rend.fly(20); rend.shake = 0.6; rend.burst(d.x, d.y, 30, '#ffd24a', 260); break;
      case 'jackpot': Au.sfx('jackpot'); rend.shake = 0.35; rend.fly(d ? 12 : 6); vib([40, 40, 80]); break;
      case 'feverEnd': Au.fever(false); break;
      case 'ballLost': Au.sfx('drain'); Au.fever(false); rend.mood = 'sad'; rend.moodT = 1.6; vib(70); break;
      case 'saved': Au.sfx('saved'); hint('save'); break;
      case 'nudge': rend.banner('パグがテーブルをゆすった！', '', 'hint'); rend.shake = 0.2; break;
      case 'mission': Au.sfx('gate'); rend.banner('目標達成！', d.t); break;
      case 'hint': hint(d); break;
      case 'secret': { const got = Save.markSecret(g.st.id); App.gotItems = App.gotItems.concat(got); if (got.length) rend.banner('解放！', got.join('、')); rend.fly(10, 'ghost'); break; }
      case 'clear': App.firstClear = Save.markClear(g.st.id) || App.firstClear; Au.sfx('clear'); rend.fly(14); for (let i = 0; i < 6; i++) rend.burst(40 + i * 58, 200 + (i % 2) * 60, 8, ['#ff5c8a', '#ffe14a', '#7be08a', '#62a8ff'][i % 4], 200); vib([40, 40, 40, 40, 120]); break;
      case 'over': Au.sfx('over'); Au.bgm(null); overTimer = setTimeout(() => App.finish(true), 1500); break;
      case 'event':
        rend.banner(d.title, d.desc);
        if (d.id === 'fever') { Au.sfx('fever'); Au.fever(true); rend.fly(18); vib([30, 40, 30, 40, 60]); }
        else if (d.id === 'gather') { Au.sfx('bark2'); rend.fly(9); } else if (d.id === 'extra') Au.sfx('extra'); else if (d.id === 'multiball') Au.sfx('bark2');
        else if (d.id === 'giant' || d.id === 'food' || d.id === 'rush' || d.id === 'door') Au.sfx('gate'); else if (d.id === 'grav') Au.sfx('spin'); else if (d.id === 'seqfail') Au.sfx('ng');
        break;
    }
  }
  function hint(k) { const s = Save.data; if (s.hints[k] || !PP.HINTS[k] || rend.tut) return; s.hints[k] = 1; rend.banner(PP.HINTS[k], '', 'hint'); }
  // チュートリアル：実際に操作すると次へ進む
  function tutorial(kind, d) {
    const t = rend.tut, g = App.g; if (!t) return;
    if (kind === 'flip') {
      if (t.step === 0 && d === 0) t.step = 1; else if (t.step === 1 && d === 1) t.step = 2;
      else if (t.step === 2 && g.flips[0].on && g.flips[1].on) { t.step = 3; g.locked = false; Au.sfx('gate'); }
    } else if (kind === 'launch' && t.step === 3) { t.step = 4; Save.data.tutorialDone = true; Save.commit(); Au.sfx('bark2'); tutTimer = setTimeout(() => { if (rend.tut === t) rend.tut = null; }, 2600); }
  }

  function frame(ts) {
    if (!App.running) return; raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000)); last = ts; const g = App.g;
    if (chargeAt) rend.charge = Math.min(1, (ts - chargeAt) / 800);
    g.update(dt); rend.draw(dt);
  }

  // ----- 入力（左右タップ・同時押し・連打に対応） -----
  function sync() { const g = App.g; if (!g || App.paused) return; let L = keys.L, R = keys.R; for (const v of ptr.values()) { if (v === 'L') L = true; else if (v === 'R') R = true; } g.setFlip(0, L); g.setFlip(1, R); }
  function canLaunch() { const g = App.g; return g && !g.over && !g.locked && g.phase === 'ready' && g.balls.some(b => b.inShooter); }
  function fire() { if (!chargeAt) return; const p = Math.min(1, (performance.now() - chargeAt) / 800); chargeAt = 0; rend.charge = -1; if (App.g) App.g.launch(p); }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); Au.unlock(); const g = App.g; if (!g || App.paused || UI.cur) return;
    const p = rend.toTable(e.clientX, e.clientY);
    if (p.y < 4 && p.x > 335) { App.pause(); return; }
    if (g.over) return;
    if (canLaunch() && p.x > 322 && p.y > 420) { ptr.set(e.pointerId, 'launch'); if (!chargeAt) chargeAt = performance.now(); return; }
    ptr.set(e.pointerId, e.clientX < window.innerWidth / 2 ? 'L' : 'R'); sync();
  }, { passive: false });
  const up = e => { const k = ptr.get(e.pointerId); if (k === undefined) return; ptr.delete(e.pointerId); if (k === 'launch') { if (![...ptr.values()].includes('launch')) fire(); } else sync(); };
  window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  for (const ev of ['touchstart', 'touchmove', 'touchend']) cv.addEventListener(ev, e => e.preventDefault(), { passive: false });
  for (const ev of ['gesturestart', 'gesturechange', 'dblclick', 'contextmenu']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  const KL = ['ArrowLeft', 'z', 'Z', 'a', 'A'], KR = ['ArrowRight', 'm', 'M', 'l', 'L', '/'], KF = [' ', 'ArrowUp', 'Enter'];
  window.addEventListener('keydown', e => {
    if (UI.cur && UI.cur !== 'pause') return; if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { App.paused ? App.resume() : App.pause(); return; } if (!App.g || App.paused) return;
    if (KL.includes(e.key)) { keys.L = true; sync(); e.preventDefault(); } else if (KR.includes(e.key)) { keys.R = true; sync(); e.preventDefault(); }
    else if (KF.includes(e.key)) { e.preventDefault(); Au.unlock(); if (canLaunch() && !chargeAt) chargeAt = performance.now(); }
  });
  window.addEventListener('keyup', e => { if (KL.includes(e.key)) { keys.L = false; sync(); } else if (KR.includes(e.key)) { keys.R = false; sync(); } else if (KF.includes(e.key)) fire(); });

  // ----- 画面サイズ・バックグラウンド -----
  function resize() { const pr = document.getElementById('safe'), cs = getComputedStyle(pr); rend.safe = { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 }; rend.resize(); if (App.g && !App.running) rend.draw(0); }
  window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 200)); if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (App.running && App.g && !App.g.over) App.pause(); else Au.suspend(); } else if (!App.paused) Au.resume(); });
  window.addEventListener('pagehide', () => { if (App.g && !App.g.over && !App.g.done && App.g.score > 0) Save.commit(); });

  // ----- 起動 -----
  Save.onError = () => UI.toast('データを保存できませんでした（空き容量・プライベートモードを確認）', 4000);
  Save.load(); UI.init(); rend.quality = Save.data.settings.quality; App.applySettings(); resize(); UI.show('title');
  if (!Save.ok) UI.toast('この環境では保存が使えません。記録は閉じると消えます', 4000);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !window.PP_NO_SW) { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }
  window.PP_TEST = { App, rend, sync };
})();

</script>
